version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: aegis_backend
    restart: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - ../../.env
    environment:
      # Force server to bind to 0.0.0.0 inside container to receive external traffic
      - HOST=0.0.0.0
    volumes:
      # Mount host folders to preserve persistent SQLite files and outputs
      - ../../data/private:/app/data/private
      - ../../vectorstore:/app/vectorstore
      - ../../outputs:/app/outputs
    extra_hosts:
      # Maps local host gateway loopback to easily call host Ollama services
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
